name: Simple AI Training Experiment

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Number of regression training epochs"
        required: true
        default: "120"
        type: string
  push:
    paths:
      - "python/simple_ai/**"
      - "data/**"
      - "tests/**"
      - ".github/workflows/train-experiment.yml"
    branches: [main]

permissions:
  contents: read

jobs:
  train-regression:
    name: Train tiny neural regression model
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression experiment
        env:
          PYTHONPATH: python
          EPOCHS: ${{ inputs.epochs || '120' }}
        run: |
          python -m simple_ai.experiments.train_regression --epochs "$EPOCHS"
      - name: Upload regression checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: simple-ai-regression-checkpoint
          path: artifacts/regression_checkpoint.json
          if-no-files-found: error
          retention-days: 14

  train-indonesian-baseline:
    name: Train Indonesian language baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Train Indonesian seed corpus
        env:
          PYTHONPATH: python
        run: |
          python -m simple_ai.experiments.train_conversation_model --epochs 5
      - name: Upload model and evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: simple-ai-indonesian-experiment
          path: artifacts/indonesian_model/
          if-no-files-found: error
          retention-days: 14

  train-transformer-smoke:
    name: Train multi-head causal Transformer v2 smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create a small deterministic smoke corpus
        run: |
          for i in $(seq 1 12); do
            echo "Halo dunia. Kita belajar bahasa Indonesia."
          done > /tmp/transformer-smoke.txt
      - name: Train one Transformer epoch
        env:
          PYTHONPATH: python
        run: |
          python -m simple_ai.experiments.train_conversation_model \
            --input /tmp/transformer-smoke.txt \
            --tokenizer char --architecture transformer_v2 \
            --context-size 8 --embedding-dim 4 --num-heads 2 \
            --epochs 1 --batch-size 8 \
            --output-dir artifacts/transformer_smoke
      - name: Upload Transformer smoke checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: simple-ai-transformer-smoke
          path: artifacts/transformer_smoke/
          if-no-files-found: error
          retention-days: 7

  test-python:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile Python sources
        env:
          PYTHONPATH: python
        run: python -m compileall -q python
      - name: Run complete test suite
        env:
          PYTHONPATH: python
        run: python -m pytest -q
