name: Simple AI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install pytest
      - name: Verify project constraints
        run: |
          test -s README.md
      - name: Compile Python sources
        run: python -m compileall -q python
      - name: Run tests
        env:
          PYTHONPATH: python
        run: python -m pytest -q

  torch-backend-tests:
    name: PyTorch backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and test tools
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy tokenizers
      - name: Run PyTorch backend tests
        env:
          PYTHONPATH: python
        run: python -m pytest -q tests/test_torch_backend.py tests/test_byte_bpe.py tests/test_byte_bpe_loader.py tests/test_train_torch_v2.py

  cpp-build:
    name: C++ native build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S cpp -B cpp/build
      - name: Build
        run: cmake --build cpp/build --parallel 2
      - name: Run native demo
        run: ./cpp/build/simple_ai_native_demo

  termux-instructions:
    name: Verify Termux guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -s README_TERMUX.md
